<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 起動バグ修正</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f2f2f2;
    color: #222;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

h1 {
    margin: 0 0 10px;
    font-size: 24px;
    line-height: 1.35;
    overflow-wrap: anywhere;
}

.description {
    margin: 0 0 20px;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.path {
    padding: 14px;
    margin: 16px 0;
    background: #f5f5f5;
    border-radius: 10px;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.upload {
    display: block;
    width: 100%;
    padding: 16px;
    background: #333;
    color: #fff;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    font-weight: 600;
    line-height: 1.4;
    overflow-wrap: anywhere;
}

.upload:hover {
    background: #444;
}

input[type="file"] {
    display: none;
}

.result {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #f5f5f5;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.success {
    color: #167a35;
    font-weight: 600;
}

.warning {
    color: #a15c00;
    font-weight: 600;
}

.download,
.share {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    text-align: center;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.4;
    cursor: pointer;
    text-decoration: none;
    overflow-wrap: anywhere;
}

.download {
    background: #167a35;
    color: #fff;
}

.download:hover {
    background: #12652b;
}

.share {
    background: #333;
    color: #fff;
}

.share:hover {
    background: #444;
}

.note {
    margin-top: 18px;
    font-size: 13px;
    color: #666;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
        border-radius: 12px;
    }

    h1 {
        font-size: 21px;
    }

    .path {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Minecraft options.txt バグ修正</h1>

    <p class="description">
        Minecraft 統合版の描画モード設定による起動バグを修正します。
    </p>

    <div class="path">
        Minecraft/games/com.mojang/minecraftpe にある
        <strong>options.txt</strong>をアップロードしてください。
    </div>

    <label class="upload" for="fileInput">
        options.txt を選択
    </label>

    <input
        id="fileInput"
        type="file"
        accept=".txt"
    >

    <div id="result" class="result"></div>

    <p class="note">
        ※「graphics_mode」がすでに「2」の場合は変更しません。<br>
        ※「graphics_mode」が2ではない場合のみ「graphics_mode:2」に変更します。<br>
        ※それ以外の設定はそのまま維持します。<br>
        ※修正後のファイル名は「options.txt」です。
    </p>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const result = document.getElementById("result");

fileInput.addEventListener("change", async function () {
    const selectedFile = this.files[0];

    if (!selectedFile) {
        return;
    }

    result.style.display = "block";
    result.innerHTML = "処理中...";

    try {
        const text = await selectedFile.text();
        const lines = text.split(/\r?\n/);

        let found = false;
        let changed = false;

        const newLines = lines.map(line => {
            if (/^graphics_mode:/.test(line)) {
                found = true;

                const value = line.substring("graphics_mode:".length);

                if (value !== "2") {
                    changed = true;
                    return "graphics_mode:2";
                }

                return line;
            }

            return line;
        });

        if (!found) {
            result.innerHTML =
                '<div class="warning">graphics_mode が見つかりませんでした。</div>';
            fileInput.value = "";
            return;
        }

        const outputText = newLines.join("\n");

        const outputBlob = new Blob(
            [outputText],
            { type: "text/plain" }
        );

        const outputUrl = URL.createObjectURL(outputBlob);

        if (changed) {
            result.innerHTML =
                '<div class="success">修正しました</div>' +
                '<div>graphics_mode を 2 に変更しました。</div>';
        } else {
            result.innerHTML =
                '<div class="success">修正の必要はありません。</div>' +
                '<div>graphics_mode はすでに 2 です。</div>';
        }

        const download = document.createElement("a");
        download.className = "download";
        download.href = outputUrl;
        download.download = "options.txt";
        download.textContent = "options.txt をダウンロード";

        result.appendChild(download);

        const shareFile = new File(
            [outputText],
            "options.txt",
            {
                type: "text/plain"
            }
        );

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files: [shareFile]
            })
        ) {
            const share = document.createElement("button");
            share.className = "share";
            share.type = "button";
            share.textContent = "「ファイル」に保存・共有";

            share.addEventListener("click", async () => {
                try {
                    const onlyOptionsFile = new File(
                        [outputText],
                        "options.txt",
                        {
                            type: "text/plain",
                            lastModified: Date.now()
                        }
                    );

                    await navigator.share({
                        files: [onlyOptionsFile]
                    });
                } catch (error) {
                    if (error.name !== "AbortError") {
                        alert("共有に失敗しました。");
                    }
                }
            });

            result.appendChild(share);
        }

        fileInput.value = "";

    } catch (error) {
        result.innerHTML =
            '<div class="warning">ファイルの読み込みに失敗しました。</div>';

        fileInput.value = "";
    }
});
</script>

</body>
</html>
